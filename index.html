<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>激突！名簿 — 東大音感 '26</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fff8f2;
  --card:#ffffff;
  --accent:#ff6b35;
  --accent2:#e8357a;
  --accent3:#ffb347;
  --text:#2a1810;
  --muted:#a07060;
  --border:rgba(180,80,40,0.13);
  --radius:12px;
}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#fff7f0 0%,#ffe4f0 35%,#fff9e6 65%,#fff0e8 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Noto Sans JP',sans-serif;
}
.hidden{display:none!important}

/* ── LOGIN ── */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;position:relative;overflow:hidden;
}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 50%,rgba(255,107,53,.1),transparent 60%),
             radial-gradient(ellipse at 70% 30%,rgba(232,53,122,.08),transparent 50%),
             radial-gradient(ellipse at 60% 80%,rgba(255,179,71,.1),transparent 50%);
  pointer-events:none;
}
.login-box{
  background:rgba(255,255,255,.88);backdrop-filter:blur(16px);
  border:1px solid rgba(255,107,53,.2);border-radius:20px;
  padding:44px 36px;width:400px;max-width:100%;
  box-shadow:0 8px 40px rgba(255,107,53,.12);position:relative;z-index:1;
}
.login-eyebrow{
  font-size:11px;color:var(--muted);text-align:center;
  letter-spacing:.1em;margin-bottom:4px;
}
.login-title{
  font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;
  text-align:center;margin-bottom:28px;
  background:linear-gradient(135deg,#ff6b35,#e8357a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input{
  width:100%;padding:10px 13px;
  background:rgba(255,255,255,.9);border:1px solid rgba(255,107,53,.2);
  border-radius:8px;font-size:14px;color:var(--text);
  font-family:'Noto Sans JP',sans-serif;outline:none;transition:border-color .2s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,53,.1)}
.btn-login{
  width:100%;margin-top:6px;padding:12px;border:none;border-radius:8px;
  background:linear-gradient(135deg,#ff6b35,#e8357a);color:#fff;
  font-size:14px;font-weight:700;font-family:'Noto Sans JP',sans-serif;
  cursor:pointer;transition:opacity .2s;box-shadow:0 4px 14px rgba(255,107,53,.3);
}
.btn-login:hover{opacity:.87}
.login-err{color:#e8357a;font-size:13px;text-align:center;margin-top:10px}
.admin-toggle{
  text-align:center;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--border);
}
.btn-text{
  background:none;border:none;color:var(--muted);font-size:12px;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;text-decoration:underline;
}

/* ── TOPBAR ── */
#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{
  height:54px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-title{
  font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,#ff6b35,#e8357a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.badge-admin{
  font-size:10px;padding:2px 7px;border-radius:4px;
  background:rgba(232,53,122,.1);color:var(--accent2);
  border:1px solid rgba(232,53,122,.25);
}
.topbar-nav{display:flex;gap:2px}
.nav-btn{
  background:none;border:none;color:var(--muted);font-size:12px;
  padding:6px 11px;border-radius:6px;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;transition:all .15s;
}
.nav-btn:hover{background:rgba(255,107,53,.07);color:var(--text)}
.nav-btn.on{background:rgba(255,107,53,.1);color:var(--accent);font-weight:500}
.btn-logout{
  background:none;border:1px solid var(--border);color:var(--muted);
  font-size:12px;padding:5px 11px;border-radius:6px;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;transition:all .15s;
}
.btn-logout:hover{border-color:var(--accent2);color:var(--accent2)}

/* ── PAGES ── */
.page{padding:24px;display:none}
.page.on{display:block}
.page-title{font-size:17px;font-weight:500;margin-bottom:4px}
.page-desc{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}

/* ── SEARCH ── */
.search-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.search-bar input,.search-bar select{
  background:rgba(255,255,255,.9);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;
  font-family:'Noto Sans JP',sans-serif;outline:none;
}
.search-bar input{flex:1;min-width:180px}
.search-bar input:focus,.search-bar select:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chip{
  font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;
  border:1px solid rgba(255,107,53,.2);color:var(--muted);
  background:rgba(255,255,255,.7);transition:all .15s;
}
.chip.on{background:rgba(255,107,53,.1);border-color:rgba(255,107,53,.4);color:var(--accent)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.result-count{font-size:12px;color:var(--muted);margin-bottom:10px}

/* ── MEMBER GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{
  background:rgba(255,255,255,.86);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;cursor:pointer;
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
.mcard:hover{transform:translateY(-2px);border-color:rgba(255,107,53,.35);box-shadow:0 6px 20px rgba(255,107,53,.1)}
.mcard-top{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.mcard-name{font-size:14px;font-weight:500}
.grade-badge{
  font-size:10px;padding:1px 6px;border-radius:4px;
  background:rgba(255,107,53,.08);color:var(--accent);
  border:1px solid rgba(255,107,53,.2);white-space:nowrap;
}
.mcard-kana{font-size:11px;color:var(--muted);margin-bottom:8px}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.pbadge{font-size:11px;padding:2px 7px;border-radius:20px}
.mcard-live{font-size:10px;padding:2px 7px;border-radius:4px;
  background:rgba(255,107,53,.07);color:var(--accent);border:1px solid rgba(255,107,53,.15)}
.mcard-live.ng{background:rgba(232,53,122,.07);color:var(--accent2);border-color:rgba(232,53,122,.2)}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(42,24,16,.45);
  backdrop-filter:blur(4px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal{
  background:#fff;border:1px solid rgba(255,107,53,.18);
  border-radius:16px;width:480px;max-width:100%;max-height:82vh;
  overflow-y:auto;padding:24px;
  box-shadow:0 16px 50px rgba(255,107,53,.13);
}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.modal-name-row{display:flex;align-items:center;gap:8px}
.modal-name{font-size:17px;font-weight:500}
.modal-sub{font-size:12px;color:var(--muted);margin-top:2px}
.btn-close{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:4px 11px;border-radius:6px;cursor:pointer;font-size:12px;
  font-family:'Noto Sans JP',sans-serif;flex-shrink:0;
}
.btn-close:hover{border-color:var(--accent2);color:var(--accent2)}
.msec{margin-bottom:12px}
.msec-label{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:4px}
.msec-val{font-size:13px;line-height:1.7}
.line-nick{
  display:inline-block;font-size:13px;color:var(--accent2);
  cursor:pointer;border-bottom:1px dashed rgba(232,53,122,.4);
  transition:color .15s;
}
.line-nick:hover{color:var(--accent)}
.suggest{font-size:11px;color:var(--accent);margin-top:4px;font-style:italic}

/* ── QR MODAL ── */
.qr-overlay{
  position:fixed;inset:0;background:rgba(42,24,16,.6);
  backdrop-filter:blur(6px);z-index:300;
  display:flex;align-items:center;justify-content:center;
}
.qr-box{
  background:#fff;border-radius:16px;padding:28px 24px 20px;
  text-align:center;border:1px solid rgba(255,107,53,.2);
  box-shadow:0 16px 50px rgba(255,107,53,.15);
}
.qr-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.qr-nick{font-size:16px;font-weight:500;color:var(--accent2);margin-bottom:14px}
.qr-note{font-size:11px;color:var(--muted);margin:12px 0}

/* ── BAND PAGE ── */
.band-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:20px}
.bcard{
  background:rgba(255,255,255,.86);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;
}
.bcard-name{font-size:15px;font-weight:500;margin-bottom:3px}
.bcard-song{font-size:13px;color:var(--accent);margin-bottom:3px}
.bcard-genre{font-size:12px;color:var(--muted);margin-bottom:10px}
.bcard-members{margin-bottom:10px}
.bcard-member{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);font-size:13px}
.bcard-member:last-child{border-bottom:none}
.bcard-part{font-size:11px;color:var(--accent2);min-width:58px}
.missing-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mbadge{
  font-size:11px;padding:2px 8px;border-radius:20px;
  background:rgba(232,53,122,.08);color:var(--accent2);
  border:1px solid rgba(232,53,122,.2);
}
.bcard-actions{display:flex;gap:7px;margin-top:10px}
.btn-sm{
  flex:1;padding:6px;border-radius:6px;font-size:12px;cursor:pointer;
  background:rgba(255,107,53,.05);border:1px solid var(--border);color:var(--muted);
  font-family:'Noto Sans JP',sans-serif;transition:all .15s;
}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.del:hover{border-color:var(--accent2);color:var(--accent2)}
.add-band{
  border:2px dashed rgba(255,107,53,.3);border-radius:var(--radius);
  padding:18px;text-align:center;color:var(--muted);cursor:pointer;
  font-size:13px;font-family:'Noto Sans JP',sans-serif;transition:all .15s;
  background:rgba(255,255,255,.5);
}
.add-band:hover{border-color:var(--accent);color:var(--accent)}

/* ── BAND FORM ── */
.bform{
  background:rgba(255,255,255,.9);border:1px solid rgba(255,107,53,.18);
  border-radius:var(--radius);padding:20px;margin-bottom:16px;
}
.bform-title{font-size:14px;font-weight:500;color:var(--accent);margin-bottom:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fg label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fg input,.fg select,.fg textarea{
  width:100%;padding:7px 10px;background:rgba(255,255,255,.9);
  border:1px solid var(--border);border-radius:6px;color:var(--text);
  font-size:12px;font-family:'Noto Sans JP',sans-serif;outline:none;
}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.fg textarea{resize:vertical;min-height:54px}
.mentry{display:flex;gap:6px;margin-bottom:7px}
.mentry select,.mentry input{
  background:rgba(255,255,255,.9);border:1px solid var(--border);
  border-radius:6px;padding:6px 9px;color:var(--text);font-size:12px;
  font-family:'Noto Sans JP',sans-serif;outline:none;
}
.mentry select:focus{border-color:var(--accent)}
.btn-rm{
  background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:6px;padding:6px 9px;cursor:pointer;font-size:11px;
  white-space:nowrap;transition:all .15s;
}
.btn-rm:hover{border-color:var(--accent2);color:var(--accent2)}
.btn-add-m{
  width:100%;margin-top:3px;padding:6px;border-radius:6px;
  border:1px dashed rgba(232,53,122,.35);color:var(--accent2);
  background:none;cursor:pointer;font-size:12px;
  font-family:'Noto Sans JP',sans-serif;transition:all .15s;
}
.btn-add-m:hover{background:rgba(232,53,122,.04);border-color:var(--accent2)}
.missing-checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.missing-checks label{display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer}
.factions{display:flex;gap:8px;margin-top:14px}
.btn-save{
  flex:1;padding:9px;border:none;border-radius:6px;
  background:linear-gradient(135deg,#ff6b35,#e8357a);color:#fff;
  font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;
}
.btn-cancel{
  padding:9px 16px;border-radius:6px;border:1px solid var(--border);
  color:var(--muted);background:none;cursor:pointer;font-size:13px;
  font-family:'Noto Sans JP',sans-serif;
}

/* ── MISSING PAGE ── */
.miss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.misscard{background:rgba(255,255,255,.86);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.misscard h4{font-size:14px;font-weight:500;margin-bottom:3px}
.misscard .song{font-size:12px;color:var(--accent);margin-bottom:8px}
.miss-count{font-size:11px;padding:2px 8px;border-radius:20px;
  background:rgba(232,53,122,.08);color:var(--accent2);
  border:1px solid rgba(232,53,122,.2);display:inline-block;margin-bottom:8px}
.cand-item{font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;cursor:pointer;transition:color .15s}
.cand-item:last-child{border-bottom:none}
.cand-item:hover{color:var(--accent)}

/* ── STATS ── */
.stats-nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.scard{background:rgba(255,255,255,.86);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.scard-num{
  font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;
  background:linear-gradient(135deg,#ff6b35,#e8357a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.scard-label{font-size:12px;color:var(--muted);margin-top:3px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-label{font-size:13px;min-width:72px}
.bar-track{flex:1;background:rgba(255,107,53,.1);border-radius:4px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#ff6b35,#e8357a);transition:width .5s}
.bar-count{font-size:12px;min-width:28px;text-align:right;color:var(--muted)}

/* ── ADMIN PAGE ── */
.grade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.grade-item{
  background:rgba(255,255,255,.86);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.grade-item select{
  background:rgba(255,255,255,.9);border:1px solid var(--border);
  border-radius:6px;padding:5px 8px;color:var(--text);font-size:12px;
  font-family:'Noto Sans JP',sans-serif;outline:none;
}
.grade-item select:focus{border-color:var(--accent)}
.bulk-btns{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:rgba(255,107,53,.2);border-radius:3px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <p class="login-eyebrow">東大音感 '26激突バンド組＆ライブ</p>
    <h1 class="login-title">🎸 激突！名簿</h1>
    <div class="field">
      <label>フルネーム（漢字）</label>
      <input id="inp-name" type="text" placeholder="例：音感　花子" autocomplete="off">
    </div>
    <div class="field">
      <label>フリガナ</label>
      <input id="inp-kana" type="text" placeholder="例：オンカン　ハナコ" autocomplete="off">
    </div>
    <button class="btn-login" id="btn-login">ログイン</button>
    <p class="login-err hidden" id="login-err">名前またはフリガナが一致しません</p>
    <div class="admin-toggle">
      <button class="btn-text" id="btn-show-admin">管理者ログイン</button>
    </div>
    <div id="admin-area" class="hidden" style="margin-top:12px">
      <div class="field">
        <label>管理者パスワード</label>
        <input id="inp-pw" type="password" placeholder="パスワードを入力">
      </div>
      <button class="btn-login" id="btn-admin-login" style="background:linear-gradient(135deg,#e8357a,#ff6b35)">管理者としてログイン</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">🎸 激突！名簿</span>
      <span id="badge-admin" class="badge-admin hidden">管理者</span>
    </div>
    <div class="topbar-nav">
      <button class="nav-btn on" data-page="pg-members">メンバー</button>
      <button class="nav-btn" data-page="pg-bands">バンド</button>
      <button class="nav-btn" data-page="pg-missing">パート探し</button>
      <button class="nav-btn" data-page="pg-stats">統計</button>
      <button class="nav-btn hidden" id="nav-admin" data-page="pg-admin">学年管理</button>
    </div>
    <button class="btn-logout" id="btn-logout">ログアウト</button>
  </div>

  <div class="page on" id="pg-members">
    <p class="page-title">メンバー一覧</p>
    <p class="page-desc">名前・ニックネーム・アーティスト名で検索できます。カードをタップで詳細表示。</p>
    <div class="search-bar">
      <input id="s-text" type="text" placeholder="名前 / ニックネーム / アーティスト名で検索...">
      <select id="s-part">
        <option value="">全パート</option>
        <option>Gt.</option><option>Ba.</option><option>Dr.</option>
        <option>Key.</option><option>Vo.</option><option>Gt./Vo.</option>
        <option>Key./Vo.</option><option>Sa.</option><option>Tp.</option>
        <option>Tb.</option><option>Vn.</option><option>Fl.</option>
      </select>
      <select id="s-live">
        <option value="">全ライブ日</option>
        <option value="6/6">6/6(土)参加可</option>
        <option value="6/7">6/7(日)参加可</option>
        <option value="両日可">両日参加可</option>
      </select>
      <select id="s-grade"><option value="">全学年</option></select>
    </div>
    <div class="chips" id="genre-chips"></div>
    <p class="result-count" id="result-count"></p>
    <div class="grid" id="member-grid"></div>
  </div>

  <div class="page" id="pg-bands">
    <p class="page-title">バンド情報</p>
    <p class="page-desc">バンドを登録して不足パートを募集しよう。登録した本人と管理者が編集できます。</p>
    <div id="band-list"></div>
    <div class="add-band" id="btn-add-band">＋ 新しいバンドを登録する</div>
    <div id="band-form-wrap" class="hidden"></div>
  </div>

  <div class="page" id="pg-missing">
    <p class="page-title">パート探し</p>
    <p class="page-desc">不足パートを募集しているバンドと、担当できるメンバー候補を表示します。</p>
    <div id="missing-content"></div>
  </div>

  <div class="page" id="pg-stats">
    <p class="page-title">統計情報</p>
    <div class="stats-nums" id="stats-nums"></div>
    <div id="stats-bars"></div>
  </div>

const seenKeys = new Set();
const members = [
  ...rawMembers.map(r => [...r, 'C年']),
  ...rawSeniors.map(r => [...r, '現役'])
].filter(r => {
  const k = r[0].replace(/\s/g,'');
  if(seenKeys.has(k)) return false;
  seenKeys.add(k); return true;
}).map((r, i) => {
  const k = r[0].replace(/\s/g,'');
  return {
    id: i,
    name: r[0], kana: r[1], nick: r[2],
    parts: r[3], artists: r[4], genres: r[5],
    liveDays: r[6], bandDays: r[7],
    grade: gradeStore[k] || r[8] || 'C年'
  };
});

let currentUser = null;

// ── UTILS ─────────────────────────────────────────────────
function norm(s){ return (s||'').replace(/\s/g,'').toLowerCase(); }
function getParts(str){ return PARTS.filter(p => str.includes(p)); }
function partColor(p){ return PART_COLORS[p] || '#888'; }
function hexRgb(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

// ── LOGIN ─────────────────────────────────────────────────
function doLogin(){
  const name = document.getElementById('inp-name').value.trim();
  const kana = document.getElementById('inp-kana').value.trim();
  const found = members.find(m => norm(m.name)===norm(name) && norm(m.kana)===norm(kana));
  if(found){
    currentUser = found; isAdmin = false;
    showApp();
  } else {
    document.getElementById('login-err').classList.remove('hidden');
  }
}

function doAdminLogin(){
  const pw = document.getElementById('inp-pw').value;
  if(pw === ADMIN_PW){
    currentUser = {name:'管理者',kana:'',nick:'管理者',parts:'',artists:'',genres:'',liveDays:'',bandDays:'',grade:''};
    isAdmin = true;
    showApp();
    document.getElementById('badge-admin').classList.remove('hidden');
    document.getElementById('nav-admin').classList.remove('hidden');
  } else {
    alert('パスワードが違います');
  }
}

function showApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  initApp();
}

function doLogout(){
  currentUser = null; isAdmin = false;
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('badge-admin').classList.add('hidden');
  document.getElementById('nav-admin').classList.add('hidden');
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-kana').value = '';
  document.getElementById('login-err').classList.add('hidden');
}

// ── NAVIGATION ────────────────────────────────────────────
function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.querySelector('.nav-btn[data-page="'+id+'"]').classList.add('on');
  if(id==='pg-bands') renderBands();
  if(id==='pg-missing') renderMissing();
  if(id==='pg-stats') renderStats();
  if(id==='pg-admin') renderAdmin();
}

// ── INIT ──────────────────────────────────────────────────
function initApp(){
  buildGradeFilter();
  buildGenreChips();
  filterMembers();
}

function buildGradeFilter(){
  const sel = document.getElementById('s-grade');
  const gs = [...new Set(members.map(m=>m.grade))].sort();
  sel.innerHTML = '<option value="">全学年</option>' + gs.map(g=>'<option>'+g+'</option>').join('');
}

function buildGenreChips(){
  const map = {};
  members.forEach(m => {
    m.genres.split(/[,、・\n]/).map(s=>s.trim()).filter(Boolean).forEach(g => { map[g]=(map[g]||0)+1; });
  });
  const top = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,18);
  document.getElementById('genre-chips').innerHTML = top.map(([g]) =>
    '<span class="chip" data-genre="'+g+'">'+g+'</span>'
  ).join('');
}

// ── FILTER ────────────────────────────────────────────────
function filterMembers(){
  const q    = norm(document.getElementById('s-text').value);
  const part = document.getElementById('s-part').value;
  const live = document.getElementById('s-live').value;
  const grade= document.getElementById('s-grade').value;

  const list = members.filter(m => {
    if(q && !norm(m.name).includes(q) && !norm(m.kana).includes(q)
           && !norm(m.nick).includes(q) && !norm(m.artists).includes(q)) return false;
    if(part && !m.parts.includes(part)) return false;
    if(live==='両日可' && m.liveDays!=='両日可') return false;
    if(live==='6/6' && !m.liveDays.includes('6/6') && m.liveDays!=='両日可') return false;
    if(live==='6/7' && !m.liveDays.includes('6/7') && m.liveDays!=='両日可') return false;
    if(grade && m.grade!==grade) return false;
    if(activeGenres.size){
      const mg = m.genres.toLowerCase();
      let hit = false;
      activeGenres.forEach(g=>{ if(mg.includes(g.toLowerCase())) hit=true; });
      if(!hit) return false;
    }
    return true;
  });

  document.getElementById('result-count').textContent = list.length+'人 / '+members.length+'人';
  renderMembers(list);
}

// ── RENDER MEMBERS ────────────────────────────────────────
function renderMembers(list){
  const grid = document.getElementById('member-grid');
  if(!list.length){ grid.innerHTML='<p style="color:var(--muted);font-size:13px">該当するメンバーがいません</p>'; return; }
  grid.innerHTML = list.map(m => {
    const pts = getParts(m.parts);
    const ng = m.liveDays.includes('参加しない') || m.liveDays==='両日不可';
    const pbadges = pts.map(p => {
      const c=partColor(p), rgb=hexRgb(c);
      return '<span class="pbadge" style="background:rgba('+rgb+',.1);color:'+c+';border:1px solid rgba('+rgb+',.25)">'+p+'</span>';
    }).join('') || '<span style="font-size:11px;color:var(--muted)">'+m.parts.split('（')[0]+'</span>';
    return '<div class="mcard" data-id="'+m.id+'">'
      +'<div class="mcard-top"><span class="mcard-name">'+m.name+'</span>'
      +'<span class="grade-badge">'+m.grade+'</span></div>'
      +'<div class="mcard-kana">'+m.kana+' / <span style="color:var(--accent2)">'+m.nick+'</span></div>'
      +'<div class="parts">'+pbadges+'</div>'
      +'<span class="mcard-live'+(ng?' ng':'')+'">ライブ: '+m.liveDays+'</span>'
      +'</div>';
  }).join('');
}

// ── MODAL ─────────────────────────────────────────────────
function openModal(id){
  const m = members.find(x=>x.id===id);
  if(!m) return;
  const pts = getParts(m.parts);
  const pbadges = pts.map(p=>{
    const c=partColor(p),rgb=hexRgb(c);
    return '<span class="pbadge" style="color:'+c+';border:1px solid rgba('+rgb+',.3);background:rgba('+rgb+',.1)">'+p+'</span>';
  }).join('') || '<span style="font-size:12px">'+m.parts+'</span>';

  document.getElementById('modal-box').innerHTML =
    '<div class="modal-head">'
      +'<div><div class="modal-name-row"><span class="modal-name">'+m.name+'</span><span class="grade-badge">'+m.grade+'</span></div>'
      +'<div class="modal-sub">'+m.kana+' / <span class="line-nick" data-nick="'+m.nick+'" data-name="'+m.name+'">'+m.nick+'</span></div></div>'
      +'<button class="btn-close" id="btn-modal-close">閉じる</button>'
    +'</div>'
    +'<div class="msec"><div class="msec-label">PART</div><div class="parts">'+pbadges+'</div></div>'
    +'<div class="msec"><div class="msec-label">演奏したいアーティスト</div><div class="msec-val" style="color:var(--accent2)">'+( m.artists||'未記入')+'</div></div>'
    +'<div class="msec"><div class="msec-label">ジャンル</div><div class="msec-val">'+(m.genres||'未記入')+'</div></div>'
    +'<div class="msec"><div class="msec-label">激突ライブ出演可能日</div><div class="msec-val">'+m.liveDays+'</div></div>'
    +'<div class="msec"><div class="msec-label">バンド組参加可能日</div><div class="msec-val">'+m.bandDays+'</div></div>';

  document.getElementById('modal-overlay').classList.remove('hidden');
}

function showQR(nick, memberName){
  document.getElementById('qr-nick').textContent = nick;
  const imgUrl = QR_URLS[memberName] || '';
  const canvas = document.getElementById('qr-canvas');
  const wrap = canvas.parentElement;

  // Remove old img if exists
  const oldImg = document.getElementById('qr-img');
  if(oldImg) oldImg.remove();
  canvas.style.display = 'none';

  if(imgUrl){
    const img = document.createElement('img');
    img.id = 'qr-img';
    img.src = imgUrl;
    img.style.cssText = 'width:200px;height:200px;object-fit:contain;border-radius:8px';
    img.onerror = function(){
      // fallback to generated QR if image fails
      this.remove();
      canvas.style.display = '';
      QRCode.toCanvas(canvas, 'https://line.me/ti/p/~'+encodeURIComponent(nick),
        {width:180, margin:2, color:{dark:'#2a1810', light:'#ffffff'}});
    };
    wrap.insertBefore(img, canvas);
  } else {
    canvas.style.display = '';
    QRCode.toCanvas(canvas, 'https://line.me/ti/p/~'+encodeURIComponent(nick),
      {width:180, margin:2, color:{dark:'#2a1810', light:'#ffffff'}});
  }
  document.getElementById('qr-overlay').classList.remove('hidden');
}

// ── BANDS ─────────────────────────────────────────────────
function renderBands(){
  const wrap = document.getElementById('band-list');
  if(!bands.length){ wrap.innerHTML='<p style="color:var(--muted);font-size:13px;margin-bottom:14px">まだバンドが登録されていません。</p>'; return; }
  wrap.innerHTML = '<div class="band-grid">'+bands.map(b => {
    const mItems = (b.members||[]).map(m=>'<div class="bcard-member"><span class="bcard-part">'+m.part+'</span>'+m.name+'</div>').join('');
    const missBadges = (b.missingParts||[]).map(p=>'<span class="mbadge">'+p+' 募集中</span>').join('');
    const canEdit = isAdmin || b.createdBy===currentUser?.name;
    const editBtns = canEdit ? '<button class="btn-sm" onclick="editBand(\''+b.id+'\')">編集</button><button class="btn-sm del" onclick="deleteBand(\''+b.id+'\')">削除</button>' : '';
    return '<div class="bcard">'
      +'<div class="bcard-name">'+(b.name||'バンド名未定')+'</div>'
      +'<div class="bcard-song">'+(b.song||'曲未定')+'</div>'
      +'<div class="bcard-genre">'+(b.genre||'')+'</div>'
      +'<div class="bcard-members">'+mItems+'</div>'
      +(missBadges ? '<div style="font-size:11px;color:var(--muted);margin-bottom:5px">不足パート</div><div class="missing-row">'+missBadges+'</div>' : '')
      +'<div class="bcard-actions">'+editBtns+'</div>'
      +'</div>';
  }).join('')+'</div>';
}

function showBandForm(band){
  editingBandId = band ? band.id : null;
  formMembers = band ? [...band.members] : [{name:'',part:''}];
  document.getElementById('btn-add-band').classList.add('hidden');
  document.getElementById('band-form-wrap').classList.remove('hidden');
  renderBandForm(band);
}

function renderBandForm(band){
  const mOpts = members.map(m=>'<option value="'+m.name+'" '+(band&&m.name===(formMembers[0]?.name)?'':'')+'>'+ m.name+' ('+m.parts.split(',')[0]+')</option>').join('');
  const mEntries = formMembers.map((_,i)=>buildMemberEntry(i)).join('');
  const missCks = PARTS.map(p=>'<label><input type="checkbox" value="'+p+'"'+((band?.missingParts||[]).includes(p)?' checked':'')+'> '+p+'</label>').join('');

  document.getElementById('band-form-wrap').innerHTML =
    '<div class="bform">'
    +'<div class="bform-title">'+(editingBandId?'バンドを編集':'新しいバンドを登録')+'</div>'
    +'<div class="frow"><div class="fg"><label>バンド名</label><input id="bf-name" value="'+(band?.name||'')+'" placeholder="例：音感Cバンド"></div>'
    +'<div class="fg"><label>演奏する曲</label><input id="bf-song" value="'+(band?.song||'')+'" placeholder="例：Subtitle / Official髭男dism"></div></div>'
    +'<div class="frow"><div class="fg"><label>ジャンル</label><input id="bf-genre" value="'+(band?.genre||'')+'"></div>'
    +'<div class="fg"><label>ライブ出演日</label><select id="bf-live"><option '+(band?.liveDay==='6/6(土)'?'selected':'')+'>6/6(土)</option><option '+(band?.liveDay==='6/7(日)'?'selected':'')+'>6/7(日)</option><option '+(!band?.liveDay||band?.liveDay==='未定'?'selected':'')+'>未定</option></select></div></div>'
    +'<div class="fg" style="margin-bottom:10px"><label>メンバー</label><div id="form-members">'+mEntries+'</div>'
    +'<button class="btn-add-m" id="btn-add-member">＋ メンバーを追加</button></div>'
    +'<div class="fg"><label>不足パート（複数可）</label><div class="missing-checks">'+missCks+'</div></div>'
    +'<div class="factions"><button class="btn-save" id="btn-save-band">保存</button><button class="btn-cancel" id="btn-cancel-band">キャンセル</button></div>'
    +'</div>';
}

function buildMemberEntry(i){
  const m = formMembers[i] || {name:'',part:''};
  const opts = members.map(x=>'<option value="'+x.name+'"'+(x.name===m.name?' selected':'')+'>'+x.name+'</option>').join('');
  const pOpts = PARTS.map(p=>'<option'+(p===m.part?' selected':'')+'>'+p+'</option>').join('');
  return '<div class="mentry" id="me-'+i+'">'
    +'<select style="flex:1" onchange="formMembers['+i+'].name=this.value"><option value="">選択...</option>'+opts+'</select>'
    +'<select style="width:88px" onchange="formMembers['+i+'].part=this.value">'+pOpts+'</select>'
    +'<button class="btn-rm" onclick="removeMember('+i+')">×</button>'
    +'</div>';
}

function removeMember(i){
  formMembers.splice(i,1);
  const band = editingBandId ? bands.find(b=>b.id===editingBandId) : null;
  renderBandForm(band);
}

function addMember(){
  formMembers.push({name:'',part:''});
  const band = editingBandId ? bands.find(b=>b.id===editingBandId) : null;
  renderBandForm(band);
}

function saveBand(){
  const name  = document.getElementById('bf-name').value.trim();
  const song  = document.getElementById('bf-song').value.trim();
  const genre = document.getElementById('bf-genre').value.trim();
  const liveDay = document.getElementById('bf-live').value;
  const missingParts = [...document.querySelectorAll('#band-form-wrap input[type=checkbox]:checked')].map(c=>c.value);
  const bm = formMembers.filter(m=>m.name);
  if(!name && !song){ alert('バンド名か曲名を入力してください'); return; }
  if(editingBandId){
    const idx = bands.findIndex(b=>b.id===editingBandId);
    if(idx>=0) bands[idx] = {...bands[idx], name, song, genre, liveDay, members:bm, missingParts};
  } else {
    bands.push({id: Date.now().toString(), name, song, genre, liveDay, members:bm, missingParts, createdBy: currentUser?.name||''});
  }
  saveBands();
  cancelBandForm();
  renderBands();
}

function cancelBandForm(){
  editingBandId = null;
  formMembers = [];
  document.getElementById('btn-add-band').classList.remove('hidden');
  document.getElementById('band-form-wrap').classList.add('hidden');
  document.getElementById('band-form-wrap').innerHTML = '';
}

function editBand(id){
  const b = bands.find(x=>x.id===id);
  if(b){ formMembers=[...b.members]; showBandForm(b); window.scrollTo(0,document.getElementById('pg-bands').offsetTop); }
}

function deleteBand(id){
  if(!confirm('このバンドを削除しますか？')) return;
  bands = bands.filter(b=>b.id!==id);
  saveBands();
  renderBands();
}

// ── MISSING ───────────────────────────────────────────────
function renderMissing(){
  const con = document.getElementById('missing-content');
  const need = bands.filter(b=>b.missingParts&&b.missingParts.length);
  if(!need.length){ con.innerHTML='<p style="color:var(--muted);font-size:13px">現在、パートを募集しているバンドはいません。</p>'; return; }
  con.innerHTML = '<div class="miss-grid">'+need.map(b=>{
    const cands = b.missingParts.map(part=>{
      const cs = members.filter(m=>m.parts.includes(part)).slice(0,5);
      return '<div style="margin-bottom:8px"><div style="font-size:11px;color:var(--muted);margin-bottom:3px">'+part+' 候補</div>'
        +cs.map(c=>'<div class="cand-item" data-id="'+c.id+'">'+c.name+'<span style="font-size:10px;color:var(--accent)">'+c.liveDays+'</span></div>').join('')+'</div>';
    }).join('');
    return '<div class="misscard">'
      +'<h4>'+(b.name||'バンド名未定')+'</h4>'
      +'<div class="song">'+(b.song||'曲未定')+'</div>'
      +'<span class="miss-count">'+b.missingParts.length+'パート募集中</span>'
      +cands+'</div>';
  }).join('')+'</div>';
}

// ── STATS ─────────────────────────────────────────────────
function renderStats(){
  const pCount = {};
  members.forEach(m=>{ getParts(m.parts).forEach(p=>{ pCount[p]=(pCount[p]||0)+1; }); });
  const d66 = members.filter(m=>m.liveDays.includes('6/6')||m.liveDays==='両日可').length;
  const d67 = members.filter(m=>m.liveDays.includes('6/7')||m.liveDays==='両日可').length;
  document.getElementById('stats-nums').innerHTML =
    scard(members.length,'登録メンバー数')+scard(bands.length,'登録バンド数')+scard(d66,'6/6(土)参加可')+scard(d67,'6/7(日)参加可');
  const sorted = Object.entries(pCount).sort((a,b)=>b[1]-a[1]);
  const max = sorted[0]?.[1]||1;
  document.getElementById('stats-bars').innerHTML = sorted.map(([p,n])=>
    '<div class="bar-row"><div class="bar-label" style="color:'+partColor(p)+'">'+p+'</div>'
    +'<div class="bar-track"><div class="bar-fill" style="width:'+Math.round(n/max*100)+'%"></div></div>'
    +'<div class="bar-count">'+n+'人</div></div>'
  ).join('');
}
function scard(n,label){ return '<div class="scard"><div class="scard-num">'+n+'</div><div class="scard-label">'+label+'</div></div>'; }

  document.getElementById('bulk-btns').innerHTML =
    ['D年','E年','F年','G年','現役'].map(g=>'<button class="btn-sm" style="flex:none;padding:6px 13px" onclick="bulkGrade(\''+g+'\')">全員'+g+'に</button>').join('');
  document.getElementById('grade-grid').innerHTML = seniors.map(m=>
    '<div class="grade-item">'
    +'<div><div style="font-size:13px;font-weight:500">'+m.name+'</div><div style="font-size:11px;color:var(--muted)">'+m.kana+'</div></div>'
    +'<select onchange="setGrade(\''+m.name.replace(/\s/g,'')+'\',this.value)">'
    +GRADES.map(g=>'<option'+(m.grade===g?' selected':'')+'>'+g+'</option>').join('')
    +'</select></div>'
  ).join('');
}

function setGrade(key, grade){
  gradeStore[key] = grade;
  saveGrades();
  const m = members.find(x=>x.name.replace(/\s/g,'')=== key);
  if(m) m.grade = grade;
  buildGradeFilter();
}

function bulkGrade(grade){
  rawSeniors.forEach(r=>{
    const key = r[0].replace(/\s/g,'');
    gradeStore[key] = grade;
    const m = members.find(x=>x.name.replace(/\s/g,'')=== key);
    if(m) m.grade = grade;
  });
  saveGrades();
  renderAdmin();
  buildGradeFilter();
}

// ── EVENT LISTENERS ───────────────────────────────────────
document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('inp-name').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('inp-kana').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('btn-show-admin').addEventListener('click', ()=>{
  document.getElementById('admin-area').classList.toggle('hidden');
});
document.getElementById('btn-admin-login').addEventListener('click', doAdminLogin);
document.getElementById('inp-pw').addEventListener('keydown', e=>{ if(e.key==='Enter') doAdminLogin(); });
document.getElementById('btn-logout').addEventListener('click', doLogout);

// nav
document.querySelectorAll('.nav-btn[data-page]').forEach(btn=>{
  btn.addEventListener('click', ()=> showPage(btn.dataset.page));
});

// search
document.getElementById('s-text').addEventListener('input', filterMembers);
document.getElementById('s-part').addEventListener('change', filterMembers);
document.getElementById('s-live').addEventListener('change', filterMembers);
document.getElementById('s-grade').addEventListener('change', filterMembers);

// genre chips (event delegation)
document.getElementById('genre-chips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const g = chip.dataset.genre;
  if(activeGenres.has(g)){ activeGenres.delete(g); chip.classList.remove('on'); }
  else { activeGenres.add(g); chip.classList.add('on'); }
  filterMembers();
});

// member card click (event delegation)
document.getElementById('member-grid').addEventListener('click', e=>{
  const card = e.target.closest('.mcard');
  if(!card) return;
  openModal(parseInt(card.dataset.id));
});

// modal close
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.add('hidden');
});
document.getElementById('modal-box').addEventListener('click', e=>{
  if(e.target.id==='btn-modal-close')
    document.getElementById('modal-overlay').classList.add('hidden');
  if(e.target.classList.contains('line-nick'))
    showQR(e.target.dataset.nick, e.target.dataset.name);
});

// missing page candidate click
document.getElementById('missing-content').addEventListener('click', e=>{
  const item = e.target.closest('.cand-item');
  if(!item) return;
  openModal(parseInt(item.dataset.id));
  showPage('pg-members');
});

// band form events (event delegation on document)
document.addEventListener('click', e=>{
  if(e.target.id==='btn-add-band') showBandForm(null);
  if(e.target.id==='btn-add-member') addMember();
  if(e.target.id==='btn-save-band') saveBand();
  if(e.target.id==='btn-cancel-band') cancelBandForm();
});

// QR
document.getElementById('btn-close-qr').addEventListener('click', ()=>{
  document.getElementById('qr-overlay').classList.add('hidden');
});
document.getElementById('qr-overlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('qr-overlay'))
    document.getElementById('qr-overlay').classList.add('hidden');
});
</script>
