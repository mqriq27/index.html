<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>激突！名簿 — 東大音感 '26</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fff8f2;
  --surface:#fff3ea;
  --card:#ffffff;
  --accent:#ff6b35;
  --accent2:#e8357a;
  --accent3:#ffb347;
  --text:#2a1810;
  --muted:#a07060;
  --border:rgba(180,80,40,0.12);
  --radius:12px;
}
body{
  background: linear-gradient(135deg, #fff7f0 0%, #ffe4f0 30%, #fff9e6 60%, #fff0e8 100%);
  background-attachment: fixed;
  color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh
}
.hidden{display:none!important}

/* LOGIN */
#login-screen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
#login-screen::before{
  content:'';position:absolute;width:700px;height:700px;
  background:radial-gradient(circle,rgba(255,107,53,0.12) 0%,rgba(232,53,122,0.06) 50%,transparent 70%);
  top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;
}
#login-screen::after{
  content:'';position:absolute;width:400px;height:400px;
  background:radial-gradient(circle,rgba(255,179,71,0.15) 0%,transparent 70%);
  top:20%;left:70%;pointer-events:none;
}
.login-box{
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,107,53,0.2);
  border-radius:20px;padding:48px 40px;width:420px;max-width:90vw;
  position:relative;z-index:1;
  box-shadow:0 8px 40px rgba(255,107,53,0.1);
}
.login-box h1{
  font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;
  background:linear-gradient(135deg,#ff6b35,#e8357a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;margin-bottom:6px;letter-spacing:-0.5px;
}
.login-box .subtitle{color:var(--muted);text-align:center;font-size:13px;margin-bottom:32px;line-height:1.6}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:0.05em}
.form-group input{
  width:100%;background:rgba(255,255,255,0.9);border:1px solid rgba(255,107,53,0.25);
  border-radius:8px;padding:11px 14px;color:var(--text);font-size:14px;
  font-family:'Noto Sans JP',sans-serif;outline:none;
  transition:border-color 0.2s;
}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,53,0.1)}
.btn-primary{
  width:100%;background:linear-gradient(135deg,#ff6b35,#e8357a);color:#fff;border:none;
  border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;transition:opacity 0.2s;margin-top:8px;
  box-shadow:0 4px 15px rgba(255,107,53,0.3);
}
.btn-primary:hover{opacity:0.88}
.login-error{color:#e8357a;font-size:13px;text-align:center;margin-top:10px}

/* MAIN */
#main-screen{display:flex;flex-direction:column;min-height:100vh}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:56px;border-bottom:1px solid rgba(255,107,53,0.15);
  background:rgba(255,255,255,0.8);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.topbar-title{
  font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;
  background:linear-gradient(135deg,#ff6b35,#e8357a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.topbar-nav{display:flex;gap:4px}
.nav-btn{
  background:none;border:none;color:var(--muted);font-size:12px;
  padding:6px 12px;border-radius:6px;cursor:pointer;transition:all 0.2s;
  font-family:'Noto Sans JP',sans-serif;
}
.nav-btn.active,.nav-btn:hover{background:rgba(255,107,53,0.08);color:var(--text)}
.nav-btn.active{color:var(--accent)}
.logout-btn{
  background:none;border:1px solid rgba(255,107,53,0.25);color:var(--muted);
  font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;transition:all 0.2s;
}
.logout-btn:hover{border-color:var(--accent2);color:var(--accent2)}

.page{padding:28px;display:none}
.page.active{display:block}

/* SEARCH BAR */
.search-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.search-input{
  flex:1;min-width:200px;background:rgba(255,255,255,0.9);border:1px solid var(--border);
  border-radius:8px;padding:9px 14px;color:var(--text);font-size:13px;
  font-family:'Noto Sans JP',sans-serif;outline:none;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,53,0.08)}
.filter-select{
  background:rgba(255,255,255,0.9);border:1px solid var(--border);border-radius:8px;
  padding:9px 14px;color:var(--text);font-size:13px;
  font-family:'Noto Sans JP',sans-serif;outline:none;cursor:pointer;
}
.filter-select:focus{border-color:var(--accent)}

/* MEMBER GRID */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.member-card{
  background:rgba(255,255,255,0.85);border:1px solid rgba(255,107,53,0.12);
  border-radius:var(--radius);padding:18px;cursor:pointer;
  transition:border-color 0.2s,transform 0.15s,box-shadow 0.2s;
  backdrop-filter:blur(4px);
}
.member-card:hover{
  border-color:rgba(255,107,53,0.4);transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(255,107,53,0.12);
}
.member-name{font-size:15px;font-weight:500;margin-bottom:2px;color:var(--text)}
.member-kana{font-size:11px;color:var(--muted);margin-bottom:10px}
.member-nick{font-size:11px;color:var(--accent2);margin-bottom:10px}
.parts-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.part-badge{
  font-size:11px;padding:3px 8px;border-radius:20px;
  background:rgba(255,107,53,0.08);color:var(--accent);border:1px solid rgba(255,107,53,0.2);
}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.meta-tag{font-size:11px;color:var(--muted);background:rgba(255,107,53,0.06);
  padding:2px 7px;border-radius:4px}
.live-tag{
  font-size:10px;padding:2px 7px;border-radius:4px;
  background:rgba(255,107,53,0.08);color:var(--accent);border:1px solid rgba(255,107,53,0.15);
}
.live-ng{background:rgba(232,53,122,0.08)!important;color:var(--accent2)!important;border-color:rgba(232,53,122,0.2)!important}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(42,24,16,0.4);backdrop-filter:blur(4px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal-box{
  background:rgba(255,255,255,0.97);border:1px solid rgba(255,107,53,0.2);
  border-radius:16px;width:500px;max-width:100%;max-height:80vh;
  overflow-y:auto;padding:28px;
  box-shadow:0 20px 60px rgba(255,107,53,0.15);
}
.modal-box h2{font-size:18px;font-weight:500;margin-bottom:4px;color:var(--text)}
.modal-box .kana{font-size:12px;color:var(--muted);margin-bottom:16px}
.modal-section{margin-bottom:14px}
.modal-label{font-size:11px;color:var(--muted);letter-spacing:0.07em;margin-bottom:5px}
.modal-value{font-size:13px;line-height:1.7;color:var(--text)}
.close-btn{
  float:right;background:none;border:1px solid var(--border);
  color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;font-size:12px;
}
.close-btn:hover{border-color:var(--accent2);color:var(--accent2)}

/* BAND PAGE */
.band-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:28px}
.band-card{
  background:rgba(255,255,255,0.85);border:1px solid rgba(255,107,53,0.12);
  border-radius:var(--radius);padding:20px;
}
.band-card h3{font-size:15px;font-weight:500;margin-bottom:4px;color:var(--text)}
.band-song{font-size:13px;color:var(--accent);margin-bottom:12px}
.band-genre{font-size:12px;color:var(--muted);margin-bottom:10px}
.member-list{margin-bottom:12px}
.member-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.member-item:last-child{border-bottom:none}
.member-part{font-size:11px;color:var(--accent2);min-width:60px}
.member-item-name{font-size:13px;color:var(--text)}
.missing-parts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.missing-badge{
  font-size:11px;padding:3px 8px;border-radius:20px;
  background:rgba(232,53,122,0.08);color:var(--accent2);border:1px solid rgba(232,53,122,0.2);
}
.band-actions{display:flex;gap:8px;margin-top:12px}
.btn-sm{
  flex:1;background:rgba(255,107,53,0.05);border:1px solid var(--border);
  color:var(--muted);border-radius:6px;padding:7px;font-size:12px;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all 0.2s;
}
.btn-sm:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,107,53,0.08)}
.btn-sm.danger:hover{border-color:var(--accent2);color:var(--accent2);background:rgba(232,53,122,0.06)}
.add-band-btn{
  background:rgba(255,255,255,0.7);border:2px dashed rgba(255,107,53,0.3);
  border-radius:var(--radius);padding:20px;text-align:center;
  color:var(--muted);cursor:pointer;font-size:13px;
  transition:all 0.2s;font-family:'Noto Sans JP',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.add-band-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,107,53,0.04)}

/* BAND FORM */
.band-form{
  background:rgba(255,255,255,0.9);border:1px solid rgba(255,107,53,0.15);
  border-radius:var(--radius);padding:24px;margin-bottom:20px;
}
.band-form h3{font-size:15px;font-weight:500;margin-bottom:18px;color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.single{grid-template-columns:1fr}
.form-group-small label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.form-group-small input,.form-group-small select,.form-group-small textarea{
  width:100%;background:rgba(255,255,255,0.9);border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;color:var(--text);font-size:12px;
  font-family:'Noto Sans JP',sans-serif;outline:none;
}
.form-group-small input:focus,.form-group-small select:focus,.form-group-small textarea:focus{border-color:var(--accent)}
.form-group-small textarea{resize:vertical;min-height:60px}
.member-entry{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.member-entry input,.member-entry select{
  background:rgba(255,255,255,0.9);border:1px solid var(--border);
  border-radius:6px;padding:7px 10px;color:var(--text);font-size:12px;
  font-family:'Noto Sans JP',sans-serif;outline:none;
}
.member-entry input:focus,.member-entry select:focus{border-color:var(--accent)}
.remove-member-btn{
  background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:6px;padding:7px 10px;cursor:pointer;font-size:12px;transition:all 0.2s;white-space:nowrap;
}
.remove-member-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.add-member-btn{
  background:none;border:1px dashed rgba(232,53,122,0.3);color:var(--accent2);
  border-radius:6px;padding:7px 12px;cursor:pointer;font-size:12px;
  font-family:'Noto Sans JP',sans-serif;transition:all 0.2s;width:100%;margin-top:4px;
}
.add-member-btn:hover{border-color:var(--accent2);background:rgba(232,53,122,0.04)}
.form-actions{display:flex;gap:10px;margin-top:16px}
.btn-save{
  flex:1;background:linear-gradient(135deg,#ff6b35,#e8357a);color:#fff;border:none;
  border-radius:6px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;
}
.btn-cancel{
  background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:6px;padding:10px 20px;font-size:13px;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;
}

/* MISSING SEARCH PAGE */
.missing-search-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.missing-card{
  background:rgba(255,255,255,0.85);border:1px solid rgba(255,107,53,0.12);
  border-radius:var(--radius);padding:18px;
}
.missing-card h4{font-size:14px;font-weight:500;margin-bottom:4px;color:var(--text)}
.missing-card .song{font-size:12px;color:var(--accent);margin-bottom:10px}
.missing-count{
  display:inline-block;font-size:11px;
  background:rgba(232,53,122,0.08);color:var(--accent2);
  border:1px solid rgba(232,53,122,0.2);
  padding:2px 8px;border-radius:20px;margin-bottom:10px;
}
.candidate-list{margin-top:10px}
.candidate-item{
  font-size:12px;padding:5px 0;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;color:var(--text);
}
.candidate-item:last-child{border-bottom:none}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.stat-card{
  background:rgba(255,255,255,0.85);border:1px solid rgba(255,107,53,0.12);
  border-radius:var(--radius);padding:18px;
}
.stat-num{
  font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;
  background:linear-gradient(135deg,#ff6b35,#e8357a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}

/* CHIPS ROW */
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{
  font-size:11px;padding:4px 10px;border-radius:20px;cursor:pointer;
  border:1px solid rgba(255,107,53,0.2);color:var(--muted);background:rgba(255,255,255,0.7);
  transition:all 0.15s;
}
.chip.active{background:rgba(255,107,53,0.1);border-color:rgba(255,107,53,0.4);color:var(--accent)}
.chip:hover{border-color:var(--accent);color:var(--accent)}

.results-count{font-size:12px;color:var(--muted);margin-bottom:12px}
.page-title{font-size:18px;font-weight:500;margin-bottom:6px;color:var(--text)}
.page-desc{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6}

/* ADMIN BADGE */
.admin-badge{
  font-size:10px;padding:2px 7px;border-radius:4px;
  background:rgba(232,53,122,0.1);color:var(--accent2);
  border:1px solid rgba(232,53,122,0.2);margin-left:8px;
}

/* ARTIST SUGGESTION */
.artist-suggestion{
  font-size:11px;color:var(--accent);margin-top:4px;
  font-style:italic;
}

/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:rgba(255,107,53,0.05)}
::-webkit-scrollbar-thumb{background:rgba(255,107,53,0.2);border-radius:3px}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <h1><span style="display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0.08em;margin-bottom:4px">東大音感　'26激突バンド組＆ライブ</span>🎸 激突！名簿</h1>
    <p class="subtitle">バンド組みサイト<br>フルネームとフリガナを入力してログイン</p>
    <div class="form-group">
      <label>フルネーム（漢字）</label>
      <input type="text" id="login-name" placeholder="例：加藤　優貴" autocomplete="off">
    </div>
    <div class="form-group">
      <label>フリガナ</label>
      <input type="text" id="login-kana" placeholder="例：カトウ　ユウキ" autocomplete="off">
    </div>
    <button class="btn-primary" onclick="doLogin()">ログイン</button>
    <p class="login-error hidden" id="login-error">名前またはフリガナが一致しません</p>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);text-align:center">
      <button class="btn-cancel" style="font-size:12px;padding:6px 16px" onclick="showAdminLogin()">管理者ログイン</button>
    </div>
    <div id="admin-login-area" class="hidden" style="margin-top:14px">
      <div class="form-group">
        <label>管理者パスワード</label>
        <input type="password" id="admin-pw" placeholder="パスワードを入力">
      </div>
      <button class="btn-primary" style="background:var(--accent3);color:#fff" onclick="doAdminLogin()">管理者としてログイン</button>
    </div>
  </div>
</div>

<!-- MAIN SCREEN -->
<div id="main-screen" class="hidden">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="topbar-title">🎸 激突！名簿</span>
      <span id="admin-badge" class="admin-badge hidden">管理者</span>
    </div>
    <div class="topbar-nav">
      <button class="nav-btn active" onclick="showPage('members-page',this)">メンバー</button>
      <button class="nav-btn" onclick="showPage('bands-page',this)">バンド</button>
      <button class="nav-btn" onclick="showPage('missing-page',this)">パート探し</button>
      <button class="nav-btn" onclick="showPage('stats-page',this)">統計</button>
      <button class="nav-btn" id="admin-nav-btn" style="display:none" onclick="showPage('admin-page',this)">学年管理</button>
    </div>
    <button class="logout-btn" onclick="doLogout()">ログアウト</button>
  </div>

  <!-- MEMBERS PAGE -->
  <div class="page active" id="members-page">
    <p class="page-title">メンバー一覧</p>
    <p class="page-desc">メンバーの情報を確認できます。カードをクリックで詳細を表示。</p>
    <div class="search-row">
      <input class="search-input" id="member-search" placeholder="名前・ニックネーム・アーティスト名で検索..." oninput="filterMembers()">
      <select class="filter-select" id="part-filter" onchange="filterMembers()">
        <option value="">全パート</option>
        <option value="Gt.">Gt.（ギター）</option>
        <option value="Ba.">Ba.（ベース）</option>
        <option value="Dr.">Dr.（ドラム）</option>
        <option value="Key.">Key.（キーボード）</option>
        <option value="Vo.">Vo.（ボーカル）</option>
        <option value="Gt./Vo.">Gt./Vo.（ギターボーカル）</option>
        <option value="Key./Vo.">Key./Vo.（キーボードボーカル）</option>
        <option value="Sa.">Sa.（サックス）</option>
        <option value="Tp.">Tp.（トランペット）</option>
        <option value="Tb.">Tb.（トロンボーン）</option>
        <option value="Vn.">Vn.（バイオリン）</option>
        <option value="Fl.">Fl.（フルート）</option>
      </select>
      <select class="filter-select" id="live-filter" onchange="filterMembers()">
        <option value="">全ライブ日</option>
        <option value="6/6">6/6(土)参加可</option>
        <option value="6/7">6/7(日)参加可</option>
        <option value="両日可">両日参加可</option>
      </select>
      <select class="filter-select" id="grade-filter" onchange="filterMembers()">
        <option value="">全学年</option>
        <option value="C年">C年（新入生）</option>
        <option value="現役">現役生</option>
      </select>
    </div>
    <div class="chips-row" id="genre-chips"></div>
    <p class="results-count" id="results-count"></p>
    <div class="member-grid" id="member-grid"></div>
  </div>

  <!-- BANDS PAGE -->
  <div class="page" id="bands-page">
    <p class="page-title">バンド情報</p>
    <p class="page-desc">登録バンドの一覧。自分のバンドを登録して、メンバーを募集しよう！</p>
    <div id="band-list-container"></div>
    <div class="add-band-btn" onclick="showBandForm()" id="add-band-btn">
      <span style="font-size:18px">＋</span> 新しいバンドを登録する
    </div>
    <div id="band-form-container" class="hidden"></div>
  </div>

  <!-- MISSING PARTS PAGE -->
  <div class="page" id="missing-page">
    <p class="page-title">パート探し</p>

function normalizeArtistKey(s){
  return s.toLowerCase()
    .replace(/[\s　・,、。．.·\/\-_]/g,'')
    .replace(/[Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}

function suggestArtists(raw){
  if(!raw) return {display: raw, suggestions: []};
  const parts = raw.split(/[,、\n]+/).map(s=>s.trim()).filter(Boolean);
  const suggestions = [];
  const normalized = parts.map(p=>{
    const key = normalizeArtistKey(p);
    if(ARTIST_CANONICAL[key] && ARTIST_CANONICAL[key] !== p){
      suggestions.push({original:p, canonical:ARTIST_CANONICAL[key]});
      return ARTIST_CANONICAL[key];
    }
    // partial match
    for(const [k,v] of Object.entries(ARTIST_CANONICAL)){
      if(key === normalizeArtistKey(v)) return v; // already canonical
      if(key.includes(k) || k.includes(key)){
        if(v !== p){ suggestions.push({original:p, canonical:v}); return v; }
      }
    }
    return p;
  });
  return {display: normalized.join('、'), suggestions};
}

async function saveBand(bandObj){
  if(bandObj.id && typeof bandObj.id === 'string' && bandObj.id.length > 10){
    // existing band — update
    const {error} = await sb.from('bands').update({
      name: bandObj.name, song: bandObj.song, genre: bandObj.genre,
      live_day: bandObj.liveDay, members: bandObj.members,
      missing_parts: bandObj.missingParts, created_by: bandObj.createdBy
    }).eq('id', bandObj.id);
    if(error) console.error('update error', error);
  } else {
    // new band
    const {error} = await sb.from('bands').insert({
      name: bandObj.name, song: bandObj.song, genre: bandObj.genre,
      live_day: bandObj.liveDay, members: bandObj.members,
      missing_parts: bandObj.missingParts, created_by: bandObj.createdBy || ''
    });
    if(error) console.error('insert error', error);
  }
  await loadBands();
}

let activeGenres = new Set();
function buildGenreChips(){
  const genreMap = {};
  members.forEach(m=>{
    m.genres.split(/[,、・\n]/).map(g=>g.trim()).filter(Boolean).forEach(g=>{
      genreMap[g] = (genreMap[g]||0)+1;
    });
  });
  const sorted = Object.entries(genreMap).sort((a,b)=>b[1]-a[1]).slice(0,20);
  const container = document.getElementById('genre-chips');
  container.innerHTML = sorted.map(([g])=>
    `<span class="chip" onclick="toggleGenre('${g}',this)">${g}</span>`
  ).join('');
}

function toggleGenre(g, el){
  if(activeGenres.has(g)){ activeGenres.delete(g); el.classList.remove('active'); }
  else { activeGenres.add(g); el.classList.add('active'); }
  filterMembers();
}

function filterMembers(){
  const q = normalize(document.getElementById('member-search').value);
  const part = document.getElementById('part-filter').value;
  const live = document.getElementById('live-filter').value;
  const grade = document.getElementById('grade-filter').value;
  const filtered = members.filter(m=>{
    if(q && !normalize(m.name).includes(q) && !normalize(m.nick).includes(q) && !normalize(m.artists).includes(q) && !normalize(m.kana).includes(q)) return false;
    if(part && !m.parts.includes(part)) return false;
    if(live==='両日可' && m.liveDays!=='両日可') return false;
    if(live==='6/6' && !m.liveDays.includes('6/6') && m.liveDays!=='両日可') return false;
    if(live==='6/7' && !m.liveDays.includes('6/7') && m.liveDays!=='両日可') return false;
    if(grade && m.grade !== grade) return false;
    if(activeGenres.size>0){
      const mg = m.genres.toLowerCase();
      let hit = false;
      activeGenres.forEach(g=>{ if(mg.includes(g.toLowerCase())) hit=true; });
      if(!hit) return false;
    }
    return true;
  });
  document.getElementById('results-count').textContent = `${filtered.length}人 / ${members.length}人`;
  renderMembers(filtered);
}

  const sel = document.getElementById('grade-filter');

  rawSeniors.forEach(r=>{

}

function getPartColor(part){
  if(part.includes('Gt.')) return '#c44b00';
  if(part.includes('Ba.')) return '#0077aa';
  if(part.includes('Dr.')) return '#cc5500';
  if(part.includes('Key./Vo.')) return '#993388';
  if(part.includes('Key.')) return '#7722cc';
  if(part.includes('Vo.')) return '#cc1166';
  if(part.includes('Tb.')) return '#885500';
  if(part.includes('Tp.')) return '#aa6600';
  if(part.includes('Sa.')) return '#007799';
  if(part.includes('Vn.')) return '#aa2244';
  if(part.includes('Fl.')) return '#226699';
  return '#888';
}

    <div class="modal-section">
      <div class="modal-label">PART</div>
      <div class="parts-row">${parseParts(m.parts).map(p=>`<span class="part-badge" style="color:${getPartColor(p)};border-color:rgba(${hexToRgb(getPartColor(p))},0.3);background:rgba(${hexToRgb(getPartColor(p))},0.1)">${p}</span>`).join('')||`<span style="font-size:12px">${m.parts}</span>`}</div>
    </div>
    <div class="modal-section">
      <div class="modal-label">演奏したいアーティスト</div>
      <div class="modal-value" style="font-size:13px;color:var(--accent2)" id="modal-artists-${m.id}"></div>
    </div>
    <div class="modal-section">
      <div class="modal-label">ジャンル</div>
      <div class="modal-value">${m.genres||'未記入'}</div>
    </div>
    <div class="modal-section">
      <div class="modal-label">激突ライブ出演可能日</div>
      <div class="modal-value">${m.liveDays}</div>
    </div>
    <div class="modal-section">
      <div class="modal-label">バンド組参加可能日</div>
      <div class="modal-value">${m.bandDays}</div>
    </div>
  `;
  modal.classList.remove('hidden');
  // fill artist suggestions after DOM is set
  const artistEl = document.getElementById('modal-artists-'+m.id);
  if(artistEl){
    const {display, suggestions} = suggestArtists(m.artists);
    let html = `<span>${display||'未記入'}</span>`;
    if(suggestions.length){
      html += `<div class="artist-suggestion">もしかして：${suggestions.map(s=>`<b style="color:var(--accent)">${s.canonical}</b>（${s.original}）`).join('、')}</div>`;
    }
    artistEl.innerHTML = html;
  }
}

function closeModal(e){
  if(!e || e.target === document.getElementById('member-modal'))
    document.getElementById('member-modal').classList.add('hidden');
}

// BANDS
let editingBandId = null;
let bandMembers = [{name:'',part:''}];

function renderBands(){
  const container = document.getElementById('band-list-container');
  if(bands.length===0){
    container.innerHTML = `<p style="color:var(--muted);font-size:13px;margin-bottom:16px">まだバンドが登録されていません。</p>`;
    return;
  }
  container.innerHTML = `<div class="band-grid">${bands.map(b=>renderBandCard(b)).join('')}</div>`;
}

function normBand(b){
  // DB stores snake_case; normalize to camelCase
  return {
    id: b.id,
    name: b.name||'',
    song: b.song||'',
    genre: b.genre||'',
    liveDay: b.live_day || b.liveDay || '',
    members: b.members||[],
    missingParts: b.missing_parts || b.missingParts || [],
    createdBy: b.created_by || b.createdBy || ''
  };
}

function renderBandCard(raw){
  const b = normBand(raw);
  const missingBadges = (b.missingParts||[]).map(p=>
    `<span class="missing-badge">${p} 募集中</span>`
  ).join('');
  const memberItems = (b.members||[]).map(m=>
    `<div class="member-item"><span class="member-part">${m.part}</span><span class="member-item-name">${m.name}</span></div>`
  ).join('');
  const editBtns = (isAdmin||b.createdBy===currentUser?.name) ? `
    <button class="btn-sm" onclick="editBand('${b.id}')">編集</button>
    <button class="btn-sm danger" onclick="deleteBand('${b.id}')">削除</button>
  ` : '';
  return `<div class="band-card" id="band-${b.id}">
    <h3>${b.name||'バンド名未定'}</h3>
    <div class="band-song">${b.song||'曲未定'}</div>
    <div class="band-genre" style="font-size:12px;color:var(--muted)">${b.genre||''}</div>
    <div class="member-list">${memberItems}</div>
    ${(b.missingParts&&b.missingParts.length) ? '<div><div style="font-size:11px;color:var(--muted);margin-bottom:6px">不足パート</div><div class="missing-parts">'+missingBadges+'</div></div>' : ''}
    <div class="band-actions">${editBtns}</div>
  </div>`;
}

function showBandForm(band){
  editingBandId = band ? band.id : null;
  bandMembers = band ? [...band.members] : [{name:'',part:''}];
  const container = document.getElementById('band-form-container');
  container.classList.remove('hidden');
  document.getElementById('add-band-btn').style.display='none';
  renderBandForm(band);
}

function renderBandForm(band){
  const container = document.getElementById('band-form-container');
  container.innerHTML = `<div class="band-form">
    <h3>${editingBandId ? 'バンドを編集' : '新しいバンドを登録'}</h3>
    <div class="form-row">
      <div class="form-group-small">
        <label>バンド名</label>
        <input id="bf-name" value="${band?.name||''}" placeholder="例：音感D年バンド">
      </div>
      <div class="form-group-small">
        <label>演奏する曲</label>
        <input id="bf-song" value="${band?.song||''}" placeholder="例：Subtitle / Official髭男dism">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group-small">
        <label>ジャンル</label>
        <input id="bf-genre" value="${band?.genre||''}" placeholder="例：邦ロック">
      </div>
      <div class="form-group-small">
        <label>ライブ出演日</label>
        <select id="bf-liveday">
          <option ${band?.liveDay==='6/6(土)' ? 'selected':''}>6/6(土)</option>
          <option ${band?.liveDay==='6/7(日)' ? 'selected':''}>6/7(日)</option>
          <option ${(!band?.liveDay||band?.liveDay==='未定') ? 'selected':''}>未定</option>
        </select>
      </div>
    </div>
    <div class="form-group-small" style="margin-bottom:12px">
      <label>メンバー（名前とパート）</label>
      <div id="bf-members">${bandMembers.map((m,i)=>memberEntry(m,i)).join('')}</div>
      <button class="add-member-btn" onclick="addMemberEntry()">＋ メンバーを追加</button>
    </div>
    <div class="form-group-small">
      <label>不足パート（複数選択可）</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
        ${PARTS_LIST.map(p=>`<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
          <input type="checkbox" value="${p}" ${(band?.missingParts||[]).includes(p)?'checked':''} style="width:auto">
          ${p}
        </label>`).join('')}
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-save" onclick="saveBand()">保存</button>
      <button class="btn-cancel" onclick="cancelBandForm()">キャンセル</button>
    </div>
  </div>`;
}

function memberEntry(m, i){
  const memberOptions = members.map(x=>`<option value="${x.name}" ${x.name===m.name?'selected':''}>${x.name} (${x.parts.split(',')[0]})</option>`).join('');
  const partOptions = ['Gt.','Ba.','Dr.','Key.','Vo.','Gt./Vo.','Sa.','Tp.','Vn.','Fl.','その他'].map(p=>`<option ${m.part===p?'selected':''}>${p}</option>`).join('');
  return `<div class="member-entry" id="me-${i}">
    <select style="flex:1" onchange="bandMembers[${i}].name=this.value">
      <option value="">メンバーを選択...</option>
      ${memberOptions}
    </select>
    <select style="width:90px" onchange="bandMembers[${i}].part=this.value">
      ${partOptions}
    </select>
    <button class="remove-member-btn" onclick="removeMember(${i})">×</button>
  </div>`;
}

function addMemberEntry(){
  bandMembers.push({name:'',part:''});
  const b = editingBandId ? bands.find(x=>x.id===editingBandId) : null;
  renderBandForm(b);
}

function removeMember(i){
  bandMembers.splice(i,1);
  const b = editingBandId ? bands.find(x=>x.id===editingBandId) : null;
  renderBandForm(b);
}

function saveBand(){
  const name = document.getElementById('bf-name').value.trim();
  const song = document.getElementById('bf-song').value.trim();
  const genre = document.getElementById('bf-genre').value.trim();
  const liveDay = document.getElementById('bf-liveday').value;
  const missingParts = [...document.querySelectorAll('#band-form-container input[type=checkbox]:checked')].map(c=>c.value);
  const bm = bandMembers.filter(m=>m.name);
  if(!name && !song){ alert('バンド名か曲名を入力してください'); return; }
  const bandObj = {
    id: editingBandId || null,
    name, song, genre, liveDay: liveDay, members: bm,
    missingParts, createdBy: currentUser?.name||''
  };
  saveBand(bandObj);
  cancelBandForm();
}

function cancelBandForm(){
  document.getElementById('band-form-container').classList.add('hidden');
  document.getElementById('add-band-btn').style.display='flex';
  editingBandId = null;
  bandMembers = [{name:'',part:''}];
}

function editBand(id){
  const raw = bands.find(b=>b.id===id);
  if(raw){ const band=normBand(raw); bandMembers=[...band.members]; showBandForm(band); }
}

function deleteBand(id){
  if(confirm('このバンドを削除しますか？')){
    deleteBandById(id);
  }
}

// MISSING
function renderMissing(){
  const container = document.getElementById('missing-content');
  const bandsWithMissing = bands.filter(b=>b.missingParts&&b.missingParts.length);
  if(bandsWithMissing.length===0){
    container.innerHTML = `<p style="color:var(--muted);font-size:13px">現在、パートを募集しているバンドはいません。</p>`;
    return;
  }
  container.innerHTML = `<div class="missing-search-grid">${bandsWithMissing.map(b=>{
    const candidates = b.missingParts.map(part=>{
      const cands = members.filter(m=>m.parts.includes(part)).slice(0,5);
      return `<div style="margin-bottom:10px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px">${part} 候補</div>
        <div class="candidate-list">${cands.map(c=>`
          <div class="candidate-item" onclick="openModal(${c.id})" style="cursor:pointer">
            <span>${c.name}</span>
            <span style="font-size:10px;color:var(--accent2)">${c.liveDays}</span>
          </div>`).join('')}
        </div>
      </div>`;
    }).join('');
    return `<div class="missing-card">
      <h4>${b.name||'バンド名未定'}</h4>
      <div class="song">${b.song||'曲未定'}</div>
      <span class="missing-count">${b.missingParts.length}パート募集中</span>
      ${candidates}
    </div>`;
  }).join('')}</div>`;
}

// STATS
function renderStats(){
  const partCount = {};
  members.forEach(m=>{
    parseParts(m.parts).forEach(p=>{ partCount[p]=(partCount[p]||0)+1; });
  });
  const bothDays = members.filter(m=>m.liveDays==='両日可').length;
  const day66 = members.filter(m=>m.liveDays.includes('6/6')||m.liveDays==='両日可').length;
  const day67 = members.filter(m=>m.liveDays.includes('6/7')||m.liveDays==='両日可').length;
  document.getElementById('stats-content').innerHTML = `
    <div class="stat-card"><div class="stat-num">${members.length}</div><div class="stat-label">登録メンバー数</div></div>
    <div class="stat-card"><div class="stat-num">${bands.length}</div><div class="stat-label">登録バンド数</div></div>
    <div class="stat-card"><div class="stat-num">${day66}</div><div class="stat-label">6/6(土) 参加可</div></div>
    <div class="stat-card"><div class="stat-num">${day67}</div><div class="stat-label">6/7(日) 参加可</div></div>
  `;
  const breakdown = Object.entries(partCount).sort((a,b)=>b[1]-a[1]);
  document.getElementById('part-breakdown').innerHTML = `
    <p class="page-title" style="font-size:15px;margin-bottom:14px">パート別人数</p>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:400px">
      ${breakdown.map(([p,n])=>`
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:80px;font-size:13px;color:${getPartColor(p)}">${p}</div>
          <div style="flex:1;background:var(--surface);border-radius:4px;height:8px;overflow:hidden">
            <div style="width:${Math.min(n/breakdown[0][1]*100,100)}%;height:100%;background:${getPartColor(p)};border-radius:4px;transition:width 0.5s"></div>
          </div>
          <div style="font-size:13px;min-width:30px;text-align:right">${n}人</div>
        </div>`).join('')}
    </div>`;
}

document.getElementById('login-name').addEventListener('keydown', e=>{if(e.key==='Enter')doLogin()});
document.getElementById('login-kana').addEventListener('keydown', e=>{if(e.key==='Enter')doLogin()});
</script>
<!-- QR MODAL -->
<div id="qr-modal" style="
  position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;
  display:none;align-items:center;justify-content:center;
" onclick="closeQR(event)">
  <div style="background:#1e1e28;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px 28px 20px;text-align:center;min-width:240px">
    <p style="font-size:11px;color:#8888a0;margin-bottom:4px;letter-spacing:0.07em">LINE</p>
    <p id="qr-name" style="font-size:16px;font-weight:500;color:#6bffd4;margin-bottom:16px"></p>
    <div id="qr-canvas" style="display:flex;justify-content:center;margin-bottom:16px"></div>
    <p style="font-size:11px;color:#8888a0;margin-bottom:14px">QRコードをスキャンして友達追加</p>
    <button onclick="closeQR()" style="
      background:none;border:1px solid rgba(255,255,255,0.1);color:#8888a0;
      border-radius:6px;padding:6px 20px;cursor:pointer;font-size:12px;
      font-family:'Noto Sans JP',sans-serif;
    ">閉じる</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
function showLineQR(nick, event){
  event && event.stopPropagation();
  const lineUrl = `https://line.me/ti/p/~${encodeURIComponent(nick)}`;
  document.getElementById('qr-name').textContent = nick;
  const canvas = document.getElementById('qr-canvas');
  canvas.innerHTML = '';
  const c = document.createElement('canvas');
  canvas.appendChild(c);
  QRCode.toCanvas(c, lineUrl, {
    width: 180,
    color: { dark: '#0f0f13', light: '#f0f0f0' },
    margin: 2
  });
  document.getElementById('qr-modal').style.display = 'flex';
}

function closeQR(e){
  if(!e || e.target === document.getElementById('qr-modal'))
    document.getElementById('qr-modal').style.display = 'none';
}
</script>
